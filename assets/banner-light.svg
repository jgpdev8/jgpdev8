<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 230" width="840" height="230" role="img" aria-labelledby="t d">
<title id="t">Javier Galván Poley · Desarrollador Full Stack</title>
<desc id="d">Desarrollador Full Stack con .NET, Angular, React, Next.js y React Native. Jerez de la Frontera, disponible para remoto o híbrido.</desc>
<defs>
  <pattern id="dots" width="16" height="16" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#1f4e79" opacity=".13"/></pattern>
  <linearGradient id="fade" x1="0" x2="1"><stop offset="0" stop-color="#f5f8fc" stop-opacity="1"/><stop offset=".55" stop-color="#f5f8fc" stop-opacity="0"/></linearGradient>
</defs>
<style>
  .e { fill:none; stroke:#9fb6cf; stroke-width:1.6; }
  .n rect { fill:#ffffff; stroke:#9fb6cf; stroke-width:1.2; }
  .n circle { fill:#1f4e79; }
  .n .bar { fill:#d6e2ef; stroke:none; }
  .l0 rect:first-child { stroke:#1f4e79; stroke-width:1.8; }
  .l1, .l2 { animation: grow 7s ease-out infinite; }
  .l2 { animation-name: grow2; }
  @keyframes grow  { 0%,8% { opacity:0; } 18%,88% { opacity:1; } 96%,100% { opacity:0; } }
  @keyframes grow2 { 0%,22% { opacity:0; } 32%,88% { opacity:1; } 96%,100% { opacity:0; } }
  .cursor { animation: blink 1.1s steps(1) infinite; }
  @keyframes blink { 50% { opacity:0; } }
  @media (prefers-reduced-motion: reduce) { .l1, .l2, .cursor { animation:none; opacity:1; } }
</style>
<rect width="840" height="230" rx="14" fill="#f5f8fc"/>
